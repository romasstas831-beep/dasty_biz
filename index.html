<body>

<div id="app"><div class="loader"></div></div><div id="toasts"></div>
<script>
/* Встав URL веб-застосунку Apps Script (…/exec) або залиш порожнім — сайт сам запитає */
"use strict";
const API_URL='https://script.google.com/macros/s/AKfycby0zT3_b6rvgWvLr__-SBrSMjMZnf5pYaXWWXz2Ogzd5R9OsFA2UZ1x2aua-4FT_9Fr/exec';
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LS=(()=>{try{localStorage.setItem('_t',1);localStorage.removeItem('_t');return localStorage}catch(e){const m={};return{getItem:k=>m[k]??null,setItem:(k,v)=>{m[k]=String(v)},removeItem:k=>{delete m[k]}}}})();
let API=API_URL||LS.getItem('api')||'';
const S={token:LS.getItem('tk')||'',me:null,cfg:{},cats:[],items:[],recipes:[],ix:{},rm:{},tax:null,total:0,off:0,view:'home',demo:false,d:null,x:null,adm:'overview'};
try{S.cfg=JSON.parse(LS.getItem('cfg')||'{}')}catch(e){}
const uid=()=>Math.random().toString(36).slice(2)+Date.now().toString(36);
const nf=n=>Number(n||0).toLocaleString('uk-UA'),usd=n=>'$'+Number(n||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const tf=t=>new Date(+t).toLocaleString('uk-UA',{timeZone:'Europe/Kyiv',day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
const adm=()=>S.me&&S.me.role==='admin',can=p=>S.me&&(adm()||String(S.me.perms||'').split(',').map(x=>x.trim()).includes(p));
const cat=n=>S.cats.find(c=>c.name===n)||{},qty=n=>(S.ix[n]||{qty:0}).qty,isLow=i=>i.min>0&&i.qty<=i.min;
const kindOf=i=>cat(i.category).kind||'product';
const live=()=>S.recipes.filter(r=>r.enabled&&!r.archived);

const fl={};
async function api(action,data={},w){
  if(S.demo)return demo(action,data);
  if(!API)throw Error('URL бекенду не задано');
  const run=async()=>{let j;
    try{j=await(await fetch(API,{method:'POST',body:JSON.stringify({action,token:S.token,data,requestId:w?uid():undefined})})).json()}
    catch(e){throw Error("Немає зв'язку з сервером. Перевір URL і розгортання (доступ: Усі).")}
    if(!j.ok){if(j.code==='SESSION_ENDED')out(j.message||j.error);throw Error(j.message||j.error||'Помилка')}
    const d=j.data;if(d&&d.snap)snap(d.snap);return d&&d.w?d.r:d};
  if(w)return run();
  const k=action+JSON.stringify(data);return fl[k]||(fl[k]=run().finally(()=>delete fl[k]));
}

  S.off=s.tax?s.tax.now-Date.now():0;S.ix={};S.items.forEach(i=>S.ix[i.name]=i);S.rm={};live().forEach(r=>S.rm[r.out]=r);

}

function chain(tg,useStock){
  const rm=S.rm,L={};
  const lv=(n,g=[])=>{if(n in L)return L[n];if(g.includes(n))return 0;L[n]=0;const r=rm[n];if(r)L[n]=1+Math.max(0,...Object.keys(r.ing).map(i=>lv(i,[...g,n])));return L[n]};
  Object.keys(tg).forEach(n=>lv(n));
  const order=Object.keys(L).sort((a,b)=>L[b]-L[a]),need={...tg},cy={},taken={};
  order.forEach(n=>{const r=rm[n];if(!r)return;let q=need[n]||0;if(useStock&&!(n in tg)){const t=Math.min(q,qty(n));taken[n]=t;q-=t}if(q<=0)return;cy[n]=Math.ceil(q/r.yield);Object.entries(r.ing).forEach(([i,p])=>need[i]=(need[i]||0)+cy[n]*p)});
  return{rm,L,order,need,cy,taken}}

  if(t.id==='q'){Q[S.view]=t.value;clearTimeout(qt);qt=setTimeout(()=>R[S.view]&&R[S.view](),120)}
  const id=t.dataset&&t.dataset.ci;if(id){CA.cv[id]=Math.max(0,parseInt(t.value)||0);const r=S.recipes.find(x=>x.id===id);r&&cb(r);rSum()}});
document.addEventListener('submit',async e=>{const f=e.target;
  if(f.id==='sf'){e.preventDefault();const d={};SET.forEach(([k])=>d[k]=f[k].value);d.lowEnabled=f.lowEnabled.checked?'1':'0';d.tgHeartbeat=f.tgHeartbeat.checked?'1':'0';
    try{await W('admin.settingsSave',d);toast('Налаштування збережено');await refresh().catch(()=>{});main()}catch(er2){er(er2)}}});

/* ---------- фонові оновлення (легкі) ---------- */
let act=0,tick=0;['click','keydown','pointerdown'].forEach(ev=>addEventListener(ev,()=>act=1,{passive:true}));
setInterval(()=>{if(!S.me||document.hidden)return;tick++;
  $$('[data-cd]').forEach(el=>{const t=tx();el.textContent=t.cov?(t.lv==='over'?'−':'')+left(Math.abs(t.rem),true):'—'});
  if(tick%15===0){const old=document.body.dataset.tax;theme();if(document.body.dataset.tax!==old){bars();if(S.view==='tax'&&!$('.modal')&&TR)drawTax($('#main'))}}},1000);
setInterval(async()=>{if(!S.me||document.hidden||S.demo)return;
  try{const p=await api('ping',{active:!!act});S.cfg=p.cfg;S.tax=p.tax;S.me=p.me;S.off=p.tax.now-Date.now();theme();bars();
    if(act&&!$('.modal')&&!$('.sov')&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)&&['stock','products','craft'].includes(S.view)){await refresh();R[S.view]&&R[S.view]()}
    act=0}catch(e){}},30000);

/* ---------- музика (генерується в браузері) ---------- */
let AC,mus=0,mi;
function music(){const b=$('#mb');
  if(mus){mus=0;clearInterval(mi);AC.suspend();b&&(b.textContent='🔇');return}
  AC=AC||new(window.AudioContext||window.webkitAudioContext)();AC.resume();mus=1;b&&(b.textContent='🎵');
  const sc=[0,3,5,7,10,12,15,17],n=(f,t,d,v,ty)=>{const o=AC.createOscillator(),g=AC.createGain();o.type=ty;o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.03);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d)};let k=0;
  mi=setInterval(()=>{if(document.hidden)return;const t=AC.currentTime;if(k%8===0)[55,82.4,110].forEach(f=>n(f,t,5,.035,'sine'));if(Math.random()<.75)n(220*2**(sc[Math.random()*sc.length|0]/12),t,1.8,.05,'triangle');k++},650)}

/* ---------- ефекти: легкі жарини (одне полотно, ~30 кадр/с, пауза у фоні) ---------- */
const cv=$('#fx'),cx=cv.getContext('2d'),low=(navigator.hardwareConcurrency||8)<=4||matchMedia('(prefers-reduced-motion:reduce)').matches;
let FW=0,FH=0,emb=[],glow=null,fxLast=0,rgb='232,163,61';
const rnd=(a,b)=>a+Math.random()*(b-a);
if(LS.getItem('fx')!=='on'||low)document.body.classList.add('nofx');
function fxSet(on){document.body.classList.toggle('nofx',!on);LS.setItem('fx',on?'on':'off')}
function fxColor(){const h=getComputedStyle(document.body).getPropertyValue('--ac').trim().replace('#','');if(h.length>=6)rgb=[0,2,4].map(i=>parseInt(h.slice(i,i+2),16)).join(',');
  const g=document.createElement('canvas');g.width=g.height=32;const c=g.getContext('2d'),r=c.createRadialGradient(16,16,0,16,16,16);r.addColorStop(0,`rgba(${rgb},1)`);r.addColorStop(.4,`rgba(${rgb},.45)`);r.addColorStop(1,`rgba(${rgb},0)`);c.fillStyle=r;c.fillRect(0,0,32,32);glow=g}
const rs=()=>{FW=cv.width=innerWidth;FH=cv.height=innerHeight};addEventListener('resize',rs);rs();
const mkE=i=>({x:rnd(0,FW),y:i?rnd(0,FH):FH+10,s:rnd(5,13),vy:rnd(.25,.9),ph:rnd(0,6.28),sp:rnd(.004,.014)});
for(let i=0;i<22;i++)emb.push(mkE(1));
const burst=[];function puff(){if(document.body.classList.contains('nofx'))return;for(let i=0;i<24;i++)burst.push({x:innerWidth/2,y:innerHeight*.45,vx:rnd(-3,3),vy:rnd(-4,-.5),l:1})}
function frame(ts){requestAnimationFrame(frame);if(document.hidden||document.body.classList.contains('nofx')||ts-fxLast<33||!glow)return;fxLast=ts;cx.clearRect(0,0,FW,FH);
  for(let i=0;i<emb.length;i++){const e=emb[i];e.y-=e.vy;e.x+=Math.sin(ts*e.sp+e.ph)*.6;if(e.y<-20)emb[i]=mkE();cx.globalAlpha=.35+Math.sin(ts/260+e.ph)*.3;cx.drawImage(glow,e.x,e.y,e.s,e.s)}
  for(let i=burst.length-1;i>=0;i--){const p=burst[i];p.x+=p.vx;p.y+=p.vy;p.vy+=.08;p.l-=.025;if(p.l<=0){burst.splice(i,1);continue}cx.globalAlpha=p.l;cx.drawImage(glow,p.x,p.y,14,14)}}
requestAnimationFrame(frame);

/* ---------- демо-режим (без сервера) ---------- */
const DM=(()=>{const mk=(id,name,category,qty,min,unit='шт')=>({id,name,category,qty,min,unit,loc:'',note:''}),n=Date.now();
  return{cats:[{id:'c1',name:'Сигари',icon:'🚬',kind:'product'},{id:'c2',name:'Цигарки',icon:'📦',kind:'product'},{id:'c3',name:'Напівфабрикати',icon:'🧪',kind:'raw'},{id:'c4',name:'Сировина',icon:'🌿',kind:'raw'}],
  items:[mk('i1','Сигара Ромео','Сигари',120,30),mk('i2','Сигара Кубинська','Сигари',8,20),mk('i3','Цигарки Червоні','Цигарки',340,50),mk('i4','Тютюнова суміш','Напівфабрикати',25,0),mk('i5','Лист сушений','Напівфабрикати',40,0),mk('i6','Сирий тютюн','Сировина',300,40),mk('i7','Ароматизатор','Сировина',12,5),mk('i8','Стрічка','Сировина',60,10),mk('i9','Клей','Сировина',10,5),mk('i10','Папір','Сировина',200,30),mk('i11','Фільтр','Сировина',150,30)],
  recipes:[['r1','Блок сигар Ромео','Сигари','Сигара Ромео',20,2,40,{'Тютюнова суміш':10,'Стрічка':4,'Клей':2}],['r2','Блок кубинських сигар','Сигари','Сигара Кубинська',10,3,60,{'Лист сушений':20,'Стрічка':2,'Клей':1}],['r3','Блок цигарок','Цигарки','Цигарки Червоні',50,1,30,{'Тютюнова суміш':5,'Папір':10,'Фільтр':50}],['r4','Тютюнова суміш','Напівфабрикати','Тютюнова суміш',10,1,20,{'Лист сушений':5,'Ароматизатор':1}],['r5','Сушіння листа','Напівфабрикати','Лист сушений',3,1,15,{'Сирий тютюн':3}]].map(([id,name,c,out,y,skill,time,ing])=>({id,name,cat:c,out,yield:y,unit:'шт',skill,time,ing,enabled:true,archived:false,version:1})),
  me:{id:'u1',name:'Демо',login:'demo',role:'admin',perms:'stock,stock_edit,craft,tax,log',skill:5},weekly:500,rows:[{id:'t1',paidAt:n-5.2*DAY,payer:'Демо',by:'Демо',amount:500,weekly:500,note:''}],hist:[],log:[],plans:[],crafts:0,units:0}})();
const dTax=()=>{const L=ledger(DM.rows,DM.weekly),last=DM.rows.slice().sort((a,b)=>b.paidAt-a.paidAt)[0];return{weekly:DM.weekly,now:Date.now(),cov:L.cov,lv:'ok',rem:L.cov?L.cov-Date.now():0,last:last?{payer:last.payer,amount:last.amount}:null}};
const dSnap=()=>({cats:DM.cats,items:JSON.parse(JSON.stringify(DM.items)),recipes:DM.recipes,total:DM.items.reduce((a,i)=>a+i.qty,0),cfg:{siteName:'Тютюновий бізнес',tagline:'Склад · Крафт · Податки',theme:'default'},tax:dTax(),me:DM.me});
const dLog=(type,desc)=>{DM.log.unshift({time:new Date().toLocaleString('uk-UA'),user:'Демо',type,desc,status:'ok'})};
async function demo(a,d){
  const it=n=>DM.items.find(i=>i.name===n);
  switch(a){
    case'login':return{token:'demo',user:DM.me};
    case'boot':snap(dSnap());return{snap:1};
    case'ping':return{cfg:dSnap().cfg,tax:dTax(),me:DM.me};
    case'logout':return{};
    case'craft':{const r=DM.recipes.find(x=>x.id===d.recipeId);Object.entries(r.ing).forEach(([n,q])=>{it(n).qty-=q*d.cycles});it(r.out).qty+=r.yield*d.cycles;DM.crafts++;DM.units+=r.yield*d.cycles;dLog('craft',r.name+' ×'+d.cycles);snap(dSnap());return{out:r.out,produced:r.yield*d.cycles}}
    case'inventory.move':{const i=DM.items.find(x=>x.id===d.itemId),b=i.qty;i.qty=d.type==='in'?b+d.qty:d.type==='out'?b-d.qty:d.qty;DM.hist.unshift({time:new Date().toLocaleString('uk-UA'),user:'Демо',item:i.name,delta:(i.qty-b>=0?'+':'')+(i.qty-b),after:i.qty,reason:d.reason||''});dLog('stock',i.name+': '+b+' → '+i.qty);snap(dSnap());return{}}
    case'inventory.history':return DM.hist;
    case'tax.list':return{state:dTax(),rows:DM.rows};
    case'tax.pay':DM.rows.push({id:'t'+Date.now(),paidAt:d.paidAt||Date.now(),payer:d.payer,by:'Демо',amount:d.amount,weekly:DM.weekly,note:d.note||''});dLog('tax','Податок '+d.amount);snap(dSnap());return{};
    case'tax.delete':DM.rows=DM.rows.filter(r=>r.id!==d.id);snap(dSnap());return{};
    case'profile.get':return{name:DM.me.name,login:'demo',role:'admin',skill:5,crafts:DM.crafts,units:DM.units,weekUnits:DM.units,history:DM.log.slice(0,8)};
    case'plan.list':return DM.plans;case'plan.save':DM.plans.push({id:'p'+Date.now(),name:d.name,items:d.items,by:'Демо',updated:new Date().toLocaleString('uk-UA')});return{};case'plan.delete':DM.plans=DM.plans.filter(p=>p.id!==d.id);return{};
    case'log.list':return DM.log;
  }
  throw Error('Недоступно в демо-режимі');
}

/* ---------- запуск ---------- */
async function start(){
  if(!API&&!S.demo){render();askUrl();return}
  if(S.token){
    try{const c=LS.getItem('snap');if(c)snap(JSON.parse(c))}catch(e){}
    if(S.me)render();
    try{await api('boot');render()}catch(e){if(!S.me){S.token='';}if(S.me)toast('Не вдалося оновити дані: '+e.message,'err');else render()}
    return}
  render();
}
start();
