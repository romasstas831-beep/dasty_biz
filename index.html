<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Тютюновий бізнес</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0907;--card:rgba(30,24,18,.64);--text:#f1e8da;--muted:#a39682;--accent:#e8a33d;--accent2:#c0392b;--ok:#6fcf7f;--bad:#ff6b5e}
[data-theme=saloon]{--bg:#150c05;--accent:#d98a3a;--accent2:#7a3b12;--text:#f5e3c6}
[data-theme=noir]{--bg:#09090b;--accent:#cfd4dc;--accent2:#5b6472;--text:#e8eaee;--muted:#8d95a3}
[data-theme=newyear]{--bg:#06120e;--accent:#7be0a4;--accent2:#c0392b}
[data-theme=halloween]{--bg:#0e0710;--accent:#ff8a1f;--accent2:#7b2cbf}
body{--line:color-mix(in srgb,var(--accent) 22%,transparent)}
body[data-tax=warn]{--accent:#f2c230;--accent2:#b8860b}
body[data-tax=crit],body[data-tax=over]{--accent:#ff5a4a;--accent2:#8e1f16}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;
background-image:radial-gradient(1200px 700px at 15% -10%,color-mix(in srgb,var(--accent) 14%,transparent),transparent 60%),radial-gradient(900px 600px at 100% 110%,color-mix(in srgb,var(--accent2) 14%,transparent),transparent 60%);background-attachment:fixed}
h1,h2,h3,.brand{font-family:Cinzel,serif;letter-spacing:.04em}
button,input,select,textarea{font:inherit;color:inherit}
::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:#3b3025;border-radius:8px}
#fx,#decor,.vig{position:fixed;inset:0;pointer-events:none;z-index:0}#fx{width:100%;height:100%}#decor{overflow:hidden}
.vig{background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.55))}
.fl{position:absolute;opacity:.15;animation:flt var(--d) ease-in-out infinite;animation-delay:var(--dl)}
@keyframes flt{0%,100%{transform:translate(0,0) rotate(0)}30%{transform:translate(24px,-40px) rotate(12deg)}65%{transform:translate(-18px,-70px) rotate(-10deg)}}
body.nofx #fx,body.nofx #decor{display:none}
#app{position:relative;z-index:1;min-height:100vh}
.btn{background:linear-gradient(135deg,var(--accent),var(--accent2));border:0;color:#1a1008;font-weight:600;padding:.65rem 1.15rem;border-radius:12px;cursor:pointer;transition:.18s;position:relative;overflow:hidden;box-shadow:0 6px 22px -8px var(--accent)}
.btn:hover{transform:translateY(-2px);filter:brightness(1.1)}.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;filter:grayscale(.5)}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line);box-shadow:none}.btn.ghost:hover{border-color:var(--accent)}
.btn.sm{padding:.35rem .7rem;font-size:.8rem;border-radius:9px}.btn.danger{background:linear-gradient(135deg,#d9473a,#8e1f16);color:#fff}
.btn::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.3) 50%,transparent 70%);transform:translateX(-120%);transition:transform .6s}.btn:hover::after{transform:translateX(120%)}
input,select,textarea{width:100%;background:rgba(10,8,6,.65);border:1px solid var(--line);border-radius:11px;padding:.65rem .85rem;outline:none;transition:.2s}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 16%,transparent)}
select option{background:#1a1510}label{display:block;font-size:.8rem;color:var(--muted);margin:.75rem 0 .3rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;backdrop-filter:blur(14px);position:relative;overflow:hidden}
.tilt{transition:transform .25s,border-color .25s,box-shadow .25s}.tilt::before{content:"";position:absolute;inset:0;background:radial-gradient(260px circle at var(--mx,50%) var(--my,50%),color-mix(in srgb,var(--accent) 16%,transparent),transparent 60%);opacity:0;transition:.3s;pointer-events:none}
.tilt:hover{border-color:var(--accent);box-shadow:0 18px 40px -18px #000,0 0 30px -12px var(--accent)}.tilt:hover::before{opacity:1}
.fu{opacity:0;animation:fu .55s cubic-bezier(.2,.8,.2,1) forwards}@keyframes fu{from{opacity:0;transform:translateY(20px)}to{opacity:1}}
.muted{color:var(--muted)}.row{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap}.end{justify-content:flex-end}.grow{flex:1}.sb{justify-content:space-between}
.badge{display:inline-block;font-size:.7rem;padding:.16rem .55rem;border-radius:99px;background:color-mix(in srgb,var(--accent) 15%,transparent);color:var(--accent);border:1px solid var(--line)}
.badge.bad{background:rgba(255,107,94,.14);color:var(--bad);border-color:rgba(255,107,94,.35)}.badge.ok{background:rgba(111,207,127,.13);color:var(--ok);border-color:rgba(111,207,127,.3)}
.lw{min-height:100vh;display:grid;place-items:center;padding:1.5rem}.lc{width:min(430px,100%);padding:2.3rem 2rem;text-align:center}
.lc::after{content:"";position:absolute;inset:-2px;border-radius:20px;padding:2px;background:conic-gradient(from var(--ang,0deg),transparent,var(--accent),transparent 40%,var(--accent2),transparent 80%);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:spin 7s linear infinite;pointer-events:none;opacity:.7}
@property --ang{syntax:'<angle>';initial-value:0deg;inherits:false}@keyframes spin{to{--ang:360deg}}
.logo{font-size:3.2rem;display:inline-block;animation:bob 4s ease-in-out infinite;filter:drop-shadow(0 0 18px var(--accent))}@keyframes bob{50%{transform:translateY(-8px) rotate(4deg)}}
.lc h1{font-size:1.8rem;margin:.5rem 0 .2rem;background:linear-gradient(90deg,var(--accent),#fff3d6,var(--accent));background-size:200%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shn 5s linear infinite}@keyframes shn{to{background-position:200% 0}}
.lc form{text-align:left;margin-top:1.3rem}.lc .btn{width:100%;margin-top:1.2rem;padding:.85rem}
header.top{position:sticky;top:0;z-index:20;backdrop-filter:blur(16px);background:color-mix(in srgb,var(--bg) 75%,transparent);border-bottom:1px solid var(--line)}
.topIn{max-width:1250px;margin:auto;padding:.75rem 1.2rem;display:flex;align-items:center;gap:1rem;flex-wrap:wrap}
.brand{font-size:1.2rem;font-weight:900;display:flex;gap:.5rem;align-items:center;color:var(--accent)}.brand span{font-size:1.4rem;animation:bob 4s ease-in-out infinite}
nav{display:flex;gap:.3rem;flex-wrap:wrap;margin-left:.8rem}nav button{background:0;border:0;padding:.5rem .95rem;border-radius:10px;color:var(--muted);cursor:pointer;transition:.2s}
nav button:hover{color:var(--text);background:color-mix(in srgb,var(--accent) 10%,transparent)}nav button.on{color:#1a1008;background:linear-gradient(135deg,var(--accent),var(--accent2));font-weight:600}
.uc{margin-left:auto;display:flex;gap:.5rem;align-items:center}.av{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;color:#1a1008;font-weight:700;cursor:pointer}
.bn,.tbar{padding:.6rem 1.2rem;text-align:center;font-size:.88rem;position:relative;z-index:15}
.bn.info{background:color-mix(in srgb,var(--accent) 16%,#000)}.bn.warn{background:#6b5311}.bn.urgent{background:#7a1c14}
.tbar{background:color-mix(in srgb,var(--accent) 22%,#000);cursor:pointer;font-weight:500}
main{max-width:1250px;margin:auto;padding:1.5rem 1.2rem 4rem}
.pt{display:flex;align-items:end;justify-content:space-between;gap:1rem;flex-wrap:wrap;margin-bottom:1.1rem}.pt h2{font-size:1.65rem}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:1rem;margin-bottom:1.3rem}.stat{padding:1.05rem 1.2rem}
.stat b{display:block;font-size:1.8rem;font-family:Cinzel,serif;color:var(--accent)}.stat span{font-size:.8rem;color:var(--muted)}
.bar{display:flex;gap:.7rem;flex-wrap:wrap;align-items:center;margin-bottom:1.1rem}.bar input{max-width:300px}
.chips{display:flex;gap:.4rem;flex-wrap:wrap}.chip{background:rgba(30,24,18,.6);border:1px solid var(--line);color:var(--muted);padding:.38rem .8rem;border-radius:99px;cursor:pointer;font-size:.85rem;transition:.2s}
.chip:hover{color:var(--text);border-color:var(--accent)}.chip.on{background:color-mix(in srgb,var(--accent) 18%,transparent);color:var(--accent);border-color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:1.1rem}.grid.big{grid-template-columns:repeat(auto-fill,minmax(320px,1fr))}
.it{padding:1.15rem}.it .ic{font-size:2.1rem;display:inline-block;transition:.3s}.it:hover .ic{transform:scale(1.2) rotate(-8deg)}.it h3{font-size:1.05rem;margin:.5rem 0 .15rem}
.qty{font-family:Cinzel,serif;font-size:1.9rem;font-weight:700;margin-top:.5rem}.qty small{font-size:.8rem;color:var(--muted);font-family:Inter}
.meter{height:6px;border-radius:9px;background:rgba(255,255,255,.07);margin:.5rem 0;overflow:hidden}.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--accent2),var(--accent));transition:width .8s}.meter.low i{background:var(--bad)}
.ingr{list-style:none;margin:.7rem 0;display:grid;gap:.3rem}.ingr li{display:flex;justify-content:space-between;gap:.5rem;font-size:.86rem;padding:.38rem .6rem;border-radius:9px;background:rgba(0,0,0,.28)}
.ingr li.ok b{color:var(--ok)}.ingr li.no b{color:var(--bad)}
.stp{display:flex;align-items:center;gap:.35rem}.stp button{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:rgba(0,0,0,.3);cursor:pointer}.stp button:hover{border-color:var(--accent);color:var(--accent)}.stp span{min-width:32px;text-align:center;font-weight:600}
.res{margin:.4rem 0;color:var(--accent);font-size:.9rem}
.tabs{display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:1.1rem}.tabs button{background:rgba(30,24,18,.6);border:1px solid var(--line);padding:.5rem .95rem;border-radius:11px;color:var(--muted);cursor:pointer;transition:.2s}
.tabs button:hover{color:var(--text);border-color:var(--accent)}.tabs button.on{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#1a1008;font-weight:600;border-color:transparent}
.tbl{width:100%;border-collapse:collapse;font-size:.88rem}.tbl th{text-align:left;color:var(--muted);font-weight:500;font-size:.76rem;padding:.65rem .8rem;border-bottom:1px solid var(--line)}
.tbl td{padding:.62rem .8rem;border-bottom:1px solid rgba(255,255,255,.05);vertical-align:middle}.tbl tr:hover td{background:color-mix(in srgb,var(--accent) 6%,transparent)}
.tw{overflow-x:auto;padding:.3rem}.acts{display:flex;gap:.3rem;flex-wrap:wrap}.empty{text-align:center;padding:2.5rem 1rem;color:var(--muted)}.empty .big{font-size:2.8rem;display:block;animation:bob 4s ease-in-out infinite}
.chk{display:flex;align-items:center;gap:.55rem;margin-top:.8rem;color:var(--text);font-size:.9rem;cursor:pointer}.chk input{width:auto}
.modal{position:fixed;inset:0;z-index:100;background:rgba(5,3,2,.72);backdrop-filter:blur(6px);display:grid;place-items:center;padding:1rem;overflow:auto;animation:fade .2s}@keyframes fade{from{opacity:0}}
.mbox{background:linear-gradient(160deg,#241c14,#17120d);border:1px solid var(--line);border-radius:20px;padding:1.5rem;width:min(560px,100%);max-height:92vh;overflow:auto;animation:pop .3s cubic-bezier(.2,1.2,.3,1)}.mbox.w{width:min(860px,100%)}
@keyframes pop{from{transform:scale(.9) translateY(20px);opacity:0}}.mbox h3{color:var(--accent);margin-bottom:.4rem;font-size:1.25rem}.mbox form .row.end{margin-top:1.2rem}
#toasts{position:fixed;right:1rem;bottom:1rem;z-index:200;display:grid;gap:.6rem}.toast{background:#211a13;border:1px solid var(--line);border-left:4px solid var(--ok);padding:.75rem 1.05rem;border-radius:12px;max-width:340px;animation:si .35s;box-shadow:0 14px 40px -10px #000}.toast.err{border-left-color:var(--bad)}@keyframes si{from{transform:translateX(120%);opacity:0}}
.loader{width:40px;height:40px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:rot 1s linear infinite;margin:4rem auto}@keyframes rot{to{transform:rotate(360deg)}}
.taxg{display:grid;grid-template-columns:minmax(260px,380px) 1fr;gap:1.1rem;margin-bottom:1.1rem}@media(max-width:800px){.taxg{grid-template-columns:1fr}}
.ring{width:176px;height:176px;border-radius:50%;background:conic-gradient(var(--c) calc(var(--p)*1%),rgba(255,255,255,.08) 0);display:grid;place-items:center;margin:0 auto;box-shadow:0 0 40px -10px var(--c)}
.ring>div{width:146px;height:146px;border-radius:50%;background:var(--bg);display:grid;place-items:center;text-align:center;padding:.5rem}.ring b{font-family:Cinzel,serif;font-size:1.05rem}
.fl2{display:flex;align-items:center;flex-wrap:wrap;gap:.35rem;margin:.5rem 0;font-size:.88rem}.fl2 .n{background:rgba(0,0,0,.3);border:1px solid var(--line);padding:.25rem .6rem;border-radius:9px}.fl2 .o{color:var(--accent);font-weight:600}
.cg{display:grid;grid-template-columns:7fr 5fr;gap:1.4rem;align-items:start}@media(max-width:900px){.cg{grid-template-columns:1fr}}
.sticky{position:sticky;top:90px}.ci{width:78px!important;text-align:center;padding:.4rem!important}
@media(max-width:700px){nav{margin-left:0;order:3;width:100%}}@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important}}
</style>
</head>
<body>
<canvas id="fx"></canvas><div id="decor"></div><div class="vig"></div>
<div id="app"><div class="loader"></div></div><div id="toasts"></div>
<script>
/* Встав сюди URL веб-застосунку Apps Script (…/exec) або залиш порожнім — сайт сам запитає при першому запуску */
const API_URL='https://script.google.com/macros/s/AKfycby0zT3_b6rvgWvLr__-SBrSMjMZnf5pYaXWWXz2Ogzd5R9OsFA2UZ1x2aua-4FT_9Fr/exec';

const $=(s,r=document)=>r.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LS=(()=>{try{localStorage.setItem('_t',1);localStorage.removeItem('_t');return localStorage}catch(e){const m={};return{getItem:k=>m[k]||null,setItem:(k,v)=>m[k]=v,removeItem:k=>delete m[k]}}})();
let API=API_URL||LS.getItem('api')||'';
let cached={};try{cached=JSON.parse(LS.getItem('cfg')||'{}')}catch(e){}
const S={token:LS.getItem('tk')||'',me:null,cfg:cached,cats:[],items:[],recipes:[],tax:null,total:0,off:0,view:'stock',sub:'make',adm:'overview',q:'',cat:'all',kind:'all',cy:{},cm:'blocks',cv:{},d:null,x:null};
const uid=()=>Math.random().toString(36).slice(2)+Date.now().toString(36);
const num=n=>Number(n||0).toLocaleString('uk-UA'),usd=n=>'$'+Number(n||0).toFixed(2);
const tf=t=>new Date(+t).toLocaleString('uk-UA',{timeZone:'Europe/Kyiv',day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
const adm=()=>S.me&&S.me.role==='admin',can=p=>S.me&&(adm()||String(S.me.perms).split(',').includes(p));
const cat=n=>S.cats.find(c=>c.name===n)||{},qty=n=>(S.items.find(i=>i.name===n)||{qty:0}).qty,isLow=i=>i.min>0&&i.qty<=i.min;
const PERMS=[{v:'stock',t:'Історія складу'},{v:'stock_edit',t:'Рух складу'},{v:'craft',t:'Крафт'},{v:'tax',t:'Податок'},{v:'log',t:'Журнал'}];
const THEMES={default:'Класика',saloon:'Салун',noir:'Нуар',newyear:'Новий рік',halloween:'Гелловін'};

async function api(action,data={},w){
  if(!API)throw Error('URL бекенду не задано');
  let j;
  try{j=await(await fetch(API,{method:'POST',body:JSON.stringify({action,token:S.token,data,requestId:w?uid():undefined})})).json()}
  catch(e){throw Error("Немає зв'язку з сервером. Перевір URL і розгортання (доступ: Усі).")}
  if(!j.ok){if(j.code==='SESSION_ENDED')out(j.message||j.error);throw Error(j.message||j.error||'Помилка')}
  const d=j.data;if(d&&d.snap)snap(d.snap);
  return d&&d.w?d.r:d;
}
const W=(a,d)=>api(a,d,1);
function snap(s){Object.assign(S,{cats:s.cats,items:s.items,recipes:s.recipes,total:s.total,cfg:s.cfg,tax:s.tax,me:s.me});S.off=s.tax.now-Date.now();LS.setItem('cfg',JSON.stringify(s.cfg));theme()}
function theme(){document.documentElement.dataset.theme=S.cfg.theme||'default';document.body.dataset.tax=S.tax?S.tax.lv:'none';document.title=S.cfg.siteName||'Тютюновий бізнес'}
function out(m){S.token='';S.me=null;LS.removeItem('tk');render();if(m)toast(m,'err')}
function toast(m,t){const e=document.createElement('div');e.className='toast '+(t==='err'?'err':'');e.textContent=m;$('#toasts').appendChild(e);setTimeout(()=>{e.style.transition='.4s';e.style.opacity=0;setTimeout(()=>e.remove(),400)},t==='err'?5500:3000)}

/* ---------- модалки та форми ---------- */
function modal(html,mount,wide){const m=document.createElement('div');m.className='modal';m.innerHTML=`<div class="mbox ${wide?'w':''}">${html}</div>`;document.body.appendChild(m);
  const close=()=>m.remove();m.onmousedown=e=>{if(e.target===m)close()};mount&&mount(m.firstChild,close);return close}
function fh(f){const v=f.value??'';
  if(f.type==='checkbox')return`<label class="chk"><input type="checkbox" name="${f.k}" ${v?'checked':''}> ${esc(f.label)}</label>`;
  if(f.type==='multi')return`<label>${esc(f.label)}</label><div class="row">${f.options.map(o=>`<label class="chk" style="margin:.2rem .7rem 0 0"><input type="checkbox" name="${f.k}" value="${o.v}" ${(v||[]).includes(o.v)?'checked':''}> ${esc(o.t)}</label>`).join('')}</div>`;
  let i;
  if(f.type==='select')i=`<select name="${f.k}">${f.options.map(o=>`<option value="${esc(o.v)}" ${String(o.v)===String(v)?'selected':''}>${esc(o.t)}</option>`).join('')}</select>`;
  else if(f.type==='textarea')i=`<textarea name="${f.k}" rows="${f.rows||3}" placeholder="${esc(f.ph||'')}">${esc(v)}</textarea>`;
  else i=`<input name="${f.k}" type="${f.type||'text'}" value="${esc(v)}" placeholder="${esc(f.ph||'')}" ${f.type==='number'?'step="any"':''}>`;
  return`<label>${esc(f.label)}</label>${i}`}
function form({title,fields,submit='Зберегти',note='',onSubmit}){
  modal(`<h3>${esc(title)}</h3>${note?`<p class="muted" style="font-size:.85rem">${esc(note)}</p>`:''}<form>${fields.map(fh).join('')}<div class="row end"><button type="button" class="btn ghost" data-x>Скасувати</button><button class="btn">${esc(submit)}</button></div></form>`,(b,close)=>{
    b.querySelector('[data-x]').onclick=close;
    b.querySelector('form').onsubmit=async e=>{e.preventDefault();const v={};
      fields.forEach(f=>{const els=[...b.querySelectorAll(`[name="${f.k}"]`)];v[f.k]=f.type==='checkbox'?els[0].checked:f.type==='multi'?els.filter(x=>x.checked).map(x=>x.value):f.type==='number'?Number(els[0].value):els[0].value});
      const bt=b.querySelector('form .btn:not(.ghost)');bt.disabled=true;
      try{await onSubmit(v);close()}catch(err){toast(err.message,'err');bt.disabled=false}};
    const f=b.querySelector('input,select,textarea');f&&f.focus()})}
function ask(text,yes,label='Видалити'){modal(`<h3>Підтвердження</h3><p style="margin:.8rem 0 1.2rem">${esc(text)}</p><div class="row end"><button class="btn ghost" data-n>Скасувати</button><button class="btn danger" data-y>${esc(label)}</button></div>`,(b,c)=>{b.querySelector('[data-n]').onclick=c;b.querySelector('[data-y]').onclick=async()=>{try{await yes();c()}catch(e){toast(e.message,'err')}}})}
const T=(h,r)=>`<div class="card tw"><table class="tbl"><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr>${r.map(x=>`<tr>${x.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')||`<tr><td colspan="${h.length}" class="empty">Порожньо</td></tr>`}</table></div>`;
const B=(a,i,t,c='ghost')=>`<button class="btn sm ${c}" data-a="${a}" data-i="${esc(i)}">${t}</button>`;
const dl=(n,csv)=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download=n;a.click()};
const catOpts=k=>S.cats.filter(c=>!k||c.kind===k).map(c=>({v:c.name,t:c.icon+' '+c.name}));

/* ---------- рендер ---------- */
function render(){
  const A=$('#app');theme();
  if(!S.me)return login(A);
  const nav=[['stock','📦 Склад']];
  if(can('craft'))nav.push(['craft','⚒️ Крафт'],['calc','🧮 Калькулятор']);
  if(can('tax'))nav.push(['tax','🧾 Податок']);if(can('log'))nav.push(['log','📜 Журнал']);if(adm())nav.push(['admin','⚙️ Адмін']);

  <div class="uc"><button class="btn ghost sm" data-a="mus" title="Музика" id="mb">🎵</button><div class="av" data-a="prof" title="Профіль">${esc((S.me.name||'?')[0].toUpperCase())}</div>
  <div style="line-height:1.15"><div style="font-size:.88rem">${esc(S.me.name)}</div><div class="muted" style="font-size:.7rem">${esc(adm()?'Адміністратор':S.me.roleName||'Працівник')}</div></div>
  <button class="btn ghost sm" data-a="out">Вийти</button></div></div></header>
  ${showB?`<div class="bn ${esc(c.bannerKind)}">📢 ${esc(c.banner)} <span style="cursor:pointer;margin-left:.8rem;opacity:.7" data-a="bnx">✕</span></div>`:''}
  ${['warn','crit','over'].includes(tl)&&can('tax')?`<div class="tbar" data-a="nav" data-i="tax">${tl==='over'?'🚨 ПОДАТОК ПРОСТРОЧЕНО':tl==='crit'?'🚨 Терміново сплатити податок':'⚠️ Скоро потрібно сплатити податок'} — до ${tf(S.tax.cov)}. Натисни, щоб відкрити</div>`:''}

let mt=0;
async function main(){
  const m=$('#main');if(!m)return;const t=++mt;
  m.innerHTML='<div class="loader"></div>';
  let h;try{h=await V[S.view]()}catch(e){h=`<div class="empty"><span class="big">⚠️</span>${esc(e.message)}</div>`}

}

V.stock=()=>{const it=S.items,prod=it.filter(i=>cat(i.category).kind!=='raw').reduce((a,i)=>a+i.qty,0);

  <div class="stats">${[['Позицій',it.length],['Всього одиниць',num(S.total)],['Готової продукції',num(prod)],['Закінчується',it.filter(isLow).length]].map((s,i)=>`<div class="card stat tilt fu" style="animation-delay:${i*.06}s"><b>${s[1]}</b><span>${s[0]}</span></div>`).join('')}</div>
  <div class="bar"><input id="q" placeholder="🔍 Пошук…" value="${esc(S.q)}" oninput="S.q=this.value;rStock()"><div class="chips">${[['all','Все'],['product','🚬 Готова продукція'],['raw','🌿 Сировина']].map(([k,t])=>`<span class="chip ${S.kind===k?'on':''}" data-a="kind" data-i="${k}">${t}</span>`).join('')}</div></div>
  <div class="chips" style="margin-bottom:1.1rem">${chips(S.cats.map(c=>c))}</div><div id="list"></div>`};
const chips=cs=>`<span class="chip ${S.cat==='all'?'on':''}" data-a="cat" data-i="all">Всі категорії</span>`+cs.map(c=>`<span class="chip ${S.cat===c.name?'on':''}" data-a="cat" data-i="${esc(c.name)}">${esc(c.icon)} ${esc(c.name)}</span>`).join('');
function rStock(){const el=$('#list');if(!el)return;const q=S.q.toLowerCase();
  const l=S.items.filter(i=>(S.kind==='all'||(cat(i.category).kind||'product')===S.kind)&&(S.cat==='all'||i.category===S.cat)&&(!q||(i.name+i.note+i.loc).toLowerCase().includes(q)));

  <div class="qty">${num(i.qty)} <small>${esc(i.unit)}${i.min?' · мін. '+i.min:''}</small></div><div class="meter ${isLow(i)?'low':''}"><i style="width:${Math.min(100,i.qty/mx*100)}%"></i></div>
  ${can('stock_edit')?`<div class="row"><button class="btn sm ghost" data-a="mv" data-i="${i.id}">± Рух</button><button class="btn sm ghost" data-a="mn" data-i="${i.id}">🔔 Поріг</button></div>`:''}</div>`).join('')}</div>`:'<div class="empty"><span class="big">🍂</span>Нічого не знайдено</div>'}

/* ---------- крафт + схема ---------- */
V.craft=()=>`<div class="pt fu"><div><h2>Крафт</h2><span class="muted">1 цикл = 1 блок. Склад списується автоматично</span></div></div>
  <div class="tabs"><button data-a="sub" data-i="make" class="${S.sub==='make'?'on':''}">⚒️ Створити</button><button data-a="sub" data-i="scheme" class="${S.sub==='scheme'?'on':''}">🧬 Схема крафту</button></div>
  <div class="bar"><input id="q" placeholder="🔍 Пошук рецепта…" value="${esc(S.q)}" oninput="S.q=this.value;rCraft()"><div class="chips">${chips(S.cats.filter(c=>S.recipes.some(r=>r.cat===c.name)))}</div></div><div id="list"></div>`;
const mx=r=>Math.min(...Object.entries(r.ing).map(([n,q])=>Math.floor(qty(n)/q)));
const live=()=>S.recipes.filter(r=>r.enabled&&!r.archived);
function rCraft(){const el=$('#list');if(!el)return;const q=S.q.toLowerCase();
  const l=live().filter(r=>(S.cat==='all'||r.cat===S.cat)&&(!q||(r.name+r.out).toLowerCase().includes(q)));
  if(!l.length){el.innerHTML='<div class="empty"><span class="big">⚒️</span>Рецептів немає</div>';return}
  if(S.sub==='scheme'){const outs=new Set(S.recipes.map(r=>r.out));
    el.innerHTML=l.map((r,n)=>`<div class="card it fu" style="animation-delay:${Math.min(n,10)*.04}s"><div class="row sb"><h3>${esc(r.name)}</h3><span class="muted" style="font-size:.78rem">уміння ${r.skill} · ${r.time}с · v${r.version}</span></div>
    <div class="fl2">${Object.entries(r.ing).map(([n,q])=>`<span class="n">${outs.has(n)?'🔗 ':''}${esc(n)} ×${num(q)}</span>`).join('<span class="o">＋</span>')}<span class="o">➜</span><span class="n" style="border-color:var(--accent)">${esc(r.out)} ×${r.yield} ${esc(r.unit)}</span></div></div>`).join('');return}
  el.innerHTML=`<div class="grid big">${l.map((r,n)=>{const t=S.cy[r.id]||1,m=mx(r),ok=m>=t,low=!adm()&&S.me.skill<r.skill;
    return`<div class="card it tilt fu" style="animation-delay:${Math.min(n,12)*.05}s"><div class="row sb"><span class="ic">${esc(cat(r.cat).icon||'⚒️')}</span><span class="badge ${m>0?'ok':'bad'}">${m>0?'Можна: '+m:'Немає матеріалів'}</span></div>
    <h3>${esc(r.name)}</h3><div class="muted" style="font-size:.8rem">${esc(r.cat)} · уміння ${r.skill}${r.time?' · '+r.time+'с':''}</div>
    <div class="res">➜ <b>${esc(r.out)} ×${num(r.yield*t)}</b> ${esc(r.unit)}</div>
    <ul class="ingr">${Object.entries(r.ing).map(([n,q])=>`<li class="${qty(n)>=q*t?'ok':'no'}"><span>${esc(n)}</span><b>${num(qty(n))} / ${num(q*t)}</b></li>`).join('')}</ul>
    <div class="row sb"><div class="stp"><button data-a="cy" data-i="${r.id}" data-d="-1">−</button><span>${t}</span><button data-a="cy" data-i="${r.id}" data-d="1">+</button><button data-a="cy" data-i="${r.id}" data-d="max" title="Максимум">⤒</button></div>
    <button class="btn" data-a="craft" data-i="${r.id}" ${ok&&!low?'':'disabled'}>${low?'Мало вміння':ok?'⚒️ Створити':'Не вистачає'}</button></div></div>`}).join('')}</div>`}

/* ---------- калькулятор ---------- */
const blocks=r=>{const v=S.cv[r.id]||0;return S.cm==='blocks'?v:Math.ceil(v/r.yield)};
V.calc=()=>`<div class="pt fu"><div><h2>Калькулятор крафту</h2><span class="muted">Скільки сировини потрібно і чи вистачає її на складі</span></div>
  <div class="row"><div class="tabs" style="margin:0"><button data-a="cmode" data-i="blocks" class="${S.cm==='blocks'?'on':''}">За блоками</button><button data-a="cmode" data-i="items" class="${S.cm==='items'?'on':''}">За штуками</button></div>
  <button class="btn ghost sm" data-a="cload">📂 Плани</button><button class="btn ghost sm" data-a="creset">↺ Скинути</button></div></div>
  <div class="cg"><div id="cl" style="display:grid;gap:1rem"></div><div class="sticky"><div class="card" style="padding:1.2rem" id="csum"></div></div></div>`;
function rCalc(){
  $('#cl').innerHTML=live().map(r=>{const v=S.cv[r.id]||0,b=blocks(r);return`<div class="card it tilt"><div class="row sb"><div><h3>${esc(r.name)}</h3><div class="muted" style="font-size:.78rem">1 блок = ${r.yield} ${esc(r.unit)}</div>
  <div class="fl2">${Object.entries(r.ing).map(([n,q])=>`<span class="n">${esc(n)} ${num(q)}</span>`).join('')}</div></div>
  <div style="text-align:right"><div class="stp"><button data-a="cc" data-i="${r.id}" data-d="-1">−</button><input class="ci" type="number" min="0" data-ci="${r.id}" value="${v||''}" placeholder="0"><button data-a="cc" data-i="${r.id}" data-d="1">+</button></div>
  <div class="row end" style="margin-top:.4rem;gap:.25rem">${[5,10].map(k=>`<button class="btn sm ghost" data-a="cc" data-i="${r.id}" data-d="${k}">+${k}</button>`).join('')}</div>
  ${S.cm==='items'&&v?`<div class="badge" style="margin-top:.4rem">Блоків: ${b} → ${b*r.yield} ${esc(r.unit)}</div>`:''}</div></div></div>`}).join('');
  rSum()}
function calcTot(){const t={};let b=0;live().forEach(r=>{const n=blocks(r);b+=n;Object.entries(r.ing).forEach(([k,q])=>t[k]=(t[k]||0)+q*n)});return{t:Object.entries(t).filter(x=>x[1]>0),b}}
function rSum(){const{t,b}=calcTot(),el=$('#csum');if(!el)return;const g=t.reduce((a,x)=>a+x[1],0),lack=t.filter(([n,q])=>qty(n)<q).length;
  el.innerHTML=`<div class="row sb"><h3>Сумарні ресурси</h3><span class="badge">Блоків: ${b}</span></div>`+(b?`<div style="display:grid;gap:.45rem;margin:1rem 0">${t.map(([n,q])=>`<div class="row sb" style="padding:.55rem .75rem;border-radius:10px;background:rgba(0,0,0,.3)"><span>${esc(n)}</span><span><b style="color:var(--accent)">${num(q)}</b> <small class="${qty(n)>=q?'badge ok':'badge bad'}">на складі ${num(qty(n))}${qty(n)<q?' · бракує '+num(q-qty(n)):''}</small></span></div>`).join('')}</div>
  <div class="row sb" style="margin-bottom:1rem"><span class="muted">Загальна сума ресурсів</span><b style="font-family:Cinzel,serif;color:var(--accent)">${num(g)} шт.</b></div>${lack?`<p style="color:var(--bad);font-size:.85rem;margin-bottom:.8rem">⚠️ Не вистачає ${lack} позиц.</p>`:'<p style="color:var(--ok);font-size:.85rem;margin-bottom:.8rem">✅ Сировини на складі достатньо</p>'}
  <div class="row"><button class="btn grow" data-a="ccopy">📋 Скопіювати</button>${can('craft')?'<button class="btn ghost" data-a="csave">💾 План</button>':''}</div>`:'<div class="empty">Введіть кількість блоків або штук, щоб порахувати сировину.</div>')}
function calcText(){const{t,b}=calcTot();return'📋 Необхідні ресурси для крафту:\n'+t.map(([n,q])=>`• ${n}: ${num(q)}`).join('\n')+`\n\n📦 Всього блоків: ${b}\n📊 Загальна сума ресурсів: ${num(t.reduce((a,x)=>a+x[1],0))} шт.`}

const LV={none:['Платежів ще не було','#a39682'],ok:['Все гаразд','#6fcf7f'],warn:['Скоро платити','#f2c230'],crit:['Терміново!','#ff5a4a'],over:['Прострочено','#ff3b30']};
const cd=ms=>{const n=ms<0;ms=Math.abs(ms);const d=ms/864e5|0,h=ms%864e5/36e5|0,m=ms%36e5/6e4|0,s=ms%6e4/1e3|0;return(n?'−':'')+(d?d+'д ':'')+[h,m,s].map(x=>String(x).padStart(2,'0')).join(':')};

document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(t&&A[t.dataset.a])A[t.dataset.a](t)});

  if(f.id==='sf'){e.preventDefault();const d={};SET.forEach(([k])=>d[k]=f[k].value);d.lowEnabled=f.lowEnabled.checked?'1':'0';d.tgHeartbeat=f.tgHeartbeat.checked?'1':'0';

/* ---------- музика (генерується в браузері, без файлів) ---------- */
let AC,mus=0,mi;
function music(){const b=$('#mb');
  if(mus){mus=0;clearInterval(mi);AC.suspend();b.style.opacity=.6;return}
  AC=AC||new(window.AudioContext||window.webkitAudioContext)();AC.resume();mus=1;b.style.opacity=1;
  const sc=[0,3,5,7,10,12,15,17],n=(f,t,d,v,ty)=>{const o=AC.createOscillator(),g=AC.createGain();o.type=ty;o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.03);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d)};let k=0;
  mi=setInterval(()=>{const t=AC.currentTime;if(k%8===0)[55,82.4,110].forEach(f=>n(f,t,5,.035,'sine'));
    if(Math.random()<.75)n(220*2**(sc[Math.random()*sc.length|0]/12),t,1.8,.05,'triangle');k++},650)}

/* ---------- ефекти: підсвітка, дим, іскри ---------- */
document.addEventListener('mousemove',e=>{const c=e.target.closest&&e.target.closest('.tilt');if(!c)return;const b=c.getBoundingClientRect(),x=e.clientX-b.left,y=e.clientY-b.top;
  c.style.setProperty('--mx',x+'px');c.style.setProperty('--my',y+'px');c.style.transform=`perspective(900px) rotateX(${(y/b.height-.5)*-4}deg) rotateY(${(x/b.width-.5)*4}deg) translateY(-3px)`});
document.addEventListener('mouseout',e=>{const c=e.target.closest&&e.target.closest('.tilt');if(c&&!c.contains(e.relatedTarget))c.style.transform=''});
const cv=$('#fx'),cx=cv.getContext('2d');let Wd,Hd,smoke=[],emb=[],bur=[];const rnd=(a,b)=>a+Math.random()*(b-a);
const rs=()=>{Wd=cv.width=innerWidth;Hd=cv.height=innerHeight};addEventListener('resize',rs);rs();
const nS=i=>({x:rnd(0,Wd),y:i?rnd(0,Hd):Hd+80,r:rnd(60,150),vy:rnd(.15,.5),ph:rnd(0,6.28),a:rnd(.025,.07)}),nE=i=>({x:rnd(0,Wd),y:i?rnd(0,Hd):Hd+10,r:rnd(.8,2.4),vy:rnd(.3,1.1),ph:rnd(0,6.28),sp:rnd(.005,.02)});
for(let i=0;i<16;i++)smoke.push(nS(1));for(let i=0;i<34;i++)emb.push(nE(1));
const puff=(x,y)=>{for(let i=0;i<26;i++)bur.push({x,y,vx:rnd(-2.2,2.2),vy:rnd(-3.5,-.6),r:rnd(2,5),l:1})};
function frame(ts){requestAnimationFrame(frame);cx.clearRect(0,0,Wd,Hd);const nofx=document.body.classList.contains('nofx');
  const h=getComputedStyle(document.body).getPropertyValue('--accent').trim().replace('#','').padEnd(6,'0'),[r,g,b]=[0,2,4].map(i=>parseInt(h.slice(i,i+2),16)||200);
  smoke.forEach((s,i)=>{s.y-=s.vy;s.x+=Math.sin(ts/2400+s.ph)*.45;s.r+=.06;const al=s.a*Math.sin(Math.min(1,(Hd+80-s.y)/(Hd+160))*Math.PI);if(s.y<-s.r)smoke[i]=nS();
    const gr=cx.createRadialGradient(s.x,s.y,0,s.x,s.y,s.r);gr.addColorStop(0,`rgba(210,200,185,${Math.max(0,al)})`);gr.addColorStop(1,'rgba(210,200,185,0)');cx.fillStyle=gr;cx.beginPath();cx.arc(s.x,s.y,s.r,0,6.28);cx.fill()});
  emb.forEach((e,i)=>{e.y-=e.vy;e.x+=Math.sin(ts*e.sp+e.ph)*.7;if(e.y<-10)emb[i]=nE();cx.fillStyle=`rgba(${r},${g},${b},${.45+Math.sin(ts/220+e.ph)*.35})`;cx.shadowColor=`rgb(${r},${g},${b})`;cx.shadowBlur=10;cx.beginPath();cx.arc(e.x,e.y,e.r,0,6.28);cx.fill();cx.shadowBlur=0});
  bur=bur.filter(p=>p.l>0);bur.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.05;p.l-=.02;cx.fillStyle=`rgba(${r},${g},${b},${Math.max(0,p.l)})`;cx.beginPath();cx.arc(p.x,p.y,p.r*p.l+.5,0,6.28);cx.fill()})}
requestAnimationFrame(frame);
(()=>{const em=['🍂','🌿','🚬','🔥','🍃','🕯️','🍁'],d=$('#decor');for(let i=0;i<14;i++){const s=document.createElement('span');s.className='fl';s.textContent=em[i%em.length];s.style.cssText=`left:${rnd(2,96)}%;top:${rnd(5,92)}%;font-size:${rnd(1.4,3.8)}rem;--d:${rnd(14,28)}s;--dl:${-rnd(0,20)}s`;d.appendChild(s)}})();
