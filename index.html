<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tobacco Shop RP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0907; --bg2:#15110d; --card:rgba(30,24,18,.62); --card2:rgba(44,35,26,.7);
  --line:rgba(232,163,61,.18); --text:#f1e8da; --muted:#a39682;
  --accent:#e8a33d; --accent2:#c0392b; --ok:#6fcf7f; --bad:#ff6b5e;
  --mx:50%; --my:50%;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;
  background-image:radial-gradient(1200px 700px at 15% -10%,rgba(232,163,61,.13),transparent 60%),radial-gradient(900px 600px at 100% 110%,rgba(192,57,43,.12),transparent 60%);
  background-attachment:fixed}
h1,h2,h3,.brand{font-family:'Cinzel',serif;letter-spacing:.04em}
button,input,select,textarea{font:inherit;color:inherit}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:#3b3025;border-radius:8px}::-webkit-scrollbar-track{background:transparent}

/* ---- Ефекти фону ---- */
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
#decor{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.fl{position:absolute;opacity:.16;filter:blur(.4px);animation:floaty var(--d,18s) ease-in-out infinite;animation-delay:var(--dl,0s);user-select:none}
@keyframes floaty{0%,100%{transform:translate(0,0) rotate(0)}25%{transform:translate(24px,-38px) rotate(12deg)}50%{transform:translate(-18px,-70px) rotate(-10deg)}75%{transform:translate(30px,-30px) rotate(8deg)}}
body.nofx #fx,body.nofx #decor{display:none}
.vignette{position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.55))}

#app{position:relative;z-index:1;min-height:100vh}

/* ---- Загальні ---- */
.btn{background:linear-gradient(135deg,var(--accent),var(--accent2));border:0;color:#1a1008;font-weight:600;padding:.7rem 1.2rem;border-radius:12px;cursor:pointer;
  transition:transform .18s,box-shadow .18s,filter .18s;box-shadow:0 6px 22px -8px var(--accent);position:relative;overflow:hidden}
.btn:hover{transform:translateY(-2px);box-shadow:0 10px 28px -8px var(--accent);filter:brightness(1.08)}
.btn:active{transform:translateY(0) scale(.98)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none;filter:grayscale(.5)}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line);box-shadow:none}
.btn.ghost:hover{border-color:var(--accent);box-shadow:0 0 0 3px rgba(232,163,61,.1)}
.btn.sm{padding:.4rem .75rem;font-size:.82rem;border-radius:9px}
.btn.danger{background:linear-gradient(135deg,#d9473a,#8e1f16);color:#fff}
.btn::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.35) 50%,transparent 70%);transform:translateX(-120%);transition:transform .6s}
.btn:hover::after{transform:translateX(120%)}
input,select,textarea{width:100%;background:rgba(10,8,6,.65);border:1px solid var(--line);border-radius:11px;padding:.7rem .9rem;outline:none;transition:border-color .2s,box-shadow .2s}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(232,163,61,.14)}
select option{background:#1a1510}
label{display:block;font-size:.8rem;color:var(--muted);margin:.8rem 0 .3rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);position:relative;overflow:hidden}
.tilt{transition:transform .25s ease,border-color .25s,box-shadow .25s;transform-style:preserve-3d}
.tilt::before{content:"";position:absolute;inset:0;background:radial-gradient(260px circle at var(--mx) var(--my),rgba(232,163,61,.14),transparent 60%);opacity:0;transition:opacity .3s;pointer-events:none}
.tilt:hover{border-color:rgba(232,163,61,.5);box-shadow:0 18px 40px -18px rgba(0,0,0,.8),0 0 30px -12px var(--accent)}
.tilt:hover::before{opacity:1}
.fadeUp{opacity:0;animation:fadeUp .6s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes fadeUp{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
.muted{color:var(--muted)}.row{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap}.end{justify-content:flex-end}.grow{flex:1}
.badge{display:inline-block;font-size:.7rem;padding:.18rem .55rem;border-radius:99px;background:rgba(232,163,61,.15);color:var(--accent);border:1px solid var(--line)}
.badge.bad{background:rgba(255,107,94,.14);color:var(--bad);border-color:rgba(255,107,94,.35)}
.badge.ok{background:rgba(111,207,127,.13);color:var(--ok);border-color:rgba(111,207,127,.3)}

/* ---- Вхід ---- */
.loginWrap{min-height:100vh;display:grid;place-items:center;padding:1.5rem}
.loginCard{width:min(430px,100%);padding:2.4rem 2rem;text-align:center}
.loginCard::after{content:"";position:absolute;inset:-2px;border-radius:20px;padding:2px;background:conic-gradient(from var(--ang,0deg),transparent,var(--accent),transparent 40%,var(--accent2),transparent 80%);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:spin 7s linear infinite;pointer-events:none;opacity:.7}
@property --ang{syntax:'<angle>';initial-value:0deg;inherits:false}
@keyframes spin{to{--ang:360deg}}
.logo{font-size:3.3rem;display:inline-block;animation:bob 4s ease-in-out infinite;filter:drop-shadow(0 0 18px var(--accent))}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-8px) rotate(4deg)}}
.loginCard h1{font-size:1.9rem;margin:.6rem 0 .2rem;background:linear-gradient(90deg,var(--accent),#fff3d6,var(--accent));background-size:200%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 5s linear infinite}
@keyframes shine{to{background-position:200% 0}}
.loginCard form{text-align:left;margin-top:1.4rem}
.loginCard .btn{width:100%;margin-top:1.3rem;padding:.9rem}
.tiny{font-size:.75rem;margin-top:1rem;cursor:pointer;text-decoration:underline;opacity:.7}

/* ---- Шапка ---- */
header.top{position:sticky;top:0;z-index:20;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);background:rgba(11,9,7,.72);border-bottom:1px solid var(--line)}
.topIn{max-width:1250px;margin:auto;padding:.8rem 1.2rem;display:flex;align-items:center;gap:1rem;flex-wrap:wrap}
.brand{font-size:1.25rem;font-weight:900;display:flex;align-items:center;gap:.5rem;color:var(--accent)}
.brand span{font-size:1.5rem;animation:bob 4s ease-in-out infinite}
nav{display:flex;gap:.3rem;margin-left:1rem;flex-wrap:wrap}
nav button{background:none;border:0;padding:.55rem 1rem;border-radius:10px;color:var(--muted);cursor:pointer;transition:.2s;position:relative}
nav button:hover{color:var(--text);background:rgba(232,163,61,.08)}
nav button.on{color:#1a1008;background:linear-gradient(135deg,var(--accent),var(--accent2));font-weight:600}
.userChip{margin-left:auto;display:flex;align-items:center;gap:.6rem}
.avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;color:#1a1008;font-weight:700}
main{max-width:1250px;margin:auto;padding:1.6rem 1.2rem 4rem}
.pageTitle{display:flex;align-items:end;justify-content:space-between;gap:1rem;flex-wrap:wrap;margin-bottom:1.2rem}
.pageTitle h2{font-size:1.7rem}

/* ---- Статистика ---- */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:1rem;margin-bottom:1.4rem}
.stat{padding:1.1rem 1.2rem}
.stat b{display:block;font-size:1.9rem;font-family:'Cinzel',serif;color:var(--accent)}
.stat span{font-size:.8rem;color:var(--muted)}

/* ---- Фільтри ---- */
.bar{display:flex;gap:.7rem;flex-wrap:wrap;align-items:center;margin-bottom:1.2rem}
.bar input{max-width:320px}
.chips{display:flex;gap:.45rem;flex-wrap:wrap}
.chip{background:rgba(30,24,18,.6);border:1px solid var(--line);color:var(--muted);padding:.4rem .85rem;border-radius:99px;cursor:pointer;font-size:.85rem;transition:.2s}
.chip:hover{color:var(--text);border-color:var(--accent)}
.chip.on{background:rgba(232,163,61,.18);color:var(--accent);border-color:var(--accent)}

/* ---- Сітки ---- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:1.1rem}
.grid.big{grid-template-columns:repeat(auto-fill,minmax(320px,1fr))}
.it{padding:1.2rem}
.it .ic{font-size:2.2rem;display:inline-block;transition:transform .3s}
.it:hover .ic{transform:scale(1.2) rotate(-8deg)}
.it h3{font-size:1.05rem;margin:.5rem 0 .15rem;letter-spacing:.02em}
.qty{font-family:'Cinzel',serif;font-size:2rem;font-weight:700;margin-top:.6rem}
.qty small{font-size:.8rem;color:var(--muted);font-family:Inter}
.meter{height:6px;border-radius:9px;background:rgba(255,255,255,.07);margin-top:.5rem;overflow:hidden}
.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--accent2),var(--accent));border-radius:9px;transition:width .8s cubic-bezier(.2,.8,.2,1)}
.meter.low i{background:linear-gradient(90deg,#8e1f16,var(--bad))}
.ingr{list-style:none;margin:.8rem 0;display:grid;gap:.35rem}
.ingr li{display:flex;justify-content:space-between;gap:.5rem;font-size:.88rem;padding:.4rem .6rem;border-radius:9px;background:rgba(0,0,0,.25)}
.ingr li.ok b{color:var(--ok)}.ingr li.no b{color:var(--bad)}
.stepper{display:flex;align-items:center;gap:.4rem}
.stepper button{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:rgba(0,0,0,.3);cursor:pointer;font-size:1rem;transition:.15s}
.stepper button:hover{border-color:var(--accent);color:var(--accent)}
.stepper span{min-width:34px;text-align:center;font-weight:600}
.result{margin:.4rem 0;color:var(--accent);font-size:.9rem}

/* ---- Таблиці / Адмін ---- */
.tabs{display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:1.2rem}
.tabs button{background:rgba(30,24,18,.6);border:1px solid var(--line);padding:.55rem 1rem;border-radius:11px;color:var(--muted);cursor:pointer;transition:.2s}
.tabs button:hover{color:var(--text);border-color:var(--accent)}
.tabs button.on{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#1a1008;font-weight:600;border-color:transparent}
.tbl{width:100%;border-collapse:collapse;font-size:.9rem}
.tbl th{text-align:left;color:var(--muted);font-weight:500;font-size:.78rem;padding:.7rem .8rem;border-bottom:1px solid var(--line);text-transform:uppercase;letter-spacing:.06em}
.tbl td{padding:.7rem .8rem;border-bottom:1px solid rgba(255,255,255,.04);vertical-align:middle}
.tbl tr:hover td{background:rgba(232,163,61,.05)}
.tblWrap{overflow-x:auto;padding:.4rem}
.acts{display:flex;gap:.35rem;flex-wrap:wrap}
.logTxt{max-width:520px;color:var(--muted)}
.empty{text-align:center;padding:3rem 1rem;color:var(--muted)}
.empty .big{font-size:3rem;display:block;animation:bob 4s ease-in-out infinite}
.ingRow{display:grid;grid-template-columns:1fr 90px 36px;gap:.4rem;margin-bottom:.4rem}
.chk{display:flex;align-items:center;gap:.6rem;margin-top:.9rem;color:var(--text);font-size:.9rem;cursor:pointer}
.chk input{width:auto}

/* ---- Модальне вікно / Тости ---- */
.modal{position:fixed;inset:0;z-index:100;background:rgba(5,3,2,.7);backdrop-filter:blur(6px);display:grid;place-items:center;padding:1rem;animation:fade .2s;overflow:auto}
.modal.out{opacity:0;transition:opacity .2s}
@keyframes fade{from{opacity:0}}
.mbox{background:linear-gradient(160deg,#241c14,#17120d);border:1px solid var(--line);border-radius:20px;padding:1.6rem;width:min(520px,100%);max-height:92vh;overflow:auto;animation:pop .3s cubic-bezier(.2,1.2,.3,1);box-shadow:0 30px 80px -20px #000}
@keyframes pop{from{transform:scale(.88) translateY(20px);opacity:0}}
.mbox h3{margin-bottom:.4rem;font-size:1.3rem;color:var(--accent)}
.mbox form .row.end{margin-top:1.3rem}
#toasts{position:fixed;right:1rem;bottom:1rem;z-index:200;display:grid;gap:.6rem}
.toast{background:#211a13;border:1px solid var(--line);border-left:4px solid var(--ok);padding:.8rem 1.1rem;border-radius:12px;max-width:340px;animation:slideIn .35s cubic-bezier(.2,1,.3,1);box-shadow:0 14px 40px -10px #000}
.toast.err{border-left-color:var(--bad)}
@keyframes slideIn{from{transform:translateX(120%);opacity:0}}
.loader{width:42px;height:42px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:rot 1s linear infinite;margin:4rem auto}
@keyframes rot{to{transform:rotate(360deg)}}

@media(max-width:700px){nav{margin-left:0;order:3;width:100%}.userChip{margin-left:auto}.pageTitle h2{font-size:1.35rem}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important}}
</style>
</head>
<body>
<canvas id="fx"></canvas>
<div id="decor"></div>
<div class="vignette"></div>
<div id="app"><div class="loader"></div></div>
<div id="toasts"></div>

<script>
/* ============================================================
   НАЛАШТУВАННЯ: встав сюди URL веб-застосунку Apps Script
   (або залиш порожнім — сайт сам попросить URL при першому запуску)
   ============================================================ */
const API_URL = '';

/* ---------- Базові допоміжні ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LS = (() => { try { localStorage.setItem('_t', 1); localStorage.removeItem('_t'); return localStorage; } catch (e) { const m = {}; return { getItem: k => m[k] || null, setItem: (k, v) => m[k] = v, removeItem: k => delete m[k] }; } })();
let API = API_URL || LS.getItem('api') || '';
const S = { token: LS.getItem('tk') || '', user: null, cfg: {}, cats: [], items: [], recipes: [], users: [], log: null,
  view: 'stock', adm: 'items', q: '', cat: 'all', times: {} };

async function api(action, data = {}) {
  if (!API) throw new Error('URL бекенду не налаштовано');
  let r;
  try { r = await fetch(API, { method: 'POST', body: JSON.stringify({ action, token: S.token, ...data }) }); }
  catch (e) { throw new Error('Немає зв\'язку з сервером. Перевір URL та розгортання.'); }
  let j;
  try { j = await r.json(); } catch (e) { throw new Error('Сервер повернув некоректну відповідь. Перевір розгортання (доступ: Anyone).'); }
  if (!j.ok) { if (j.code === 'AUTH') { S.user = null; S.token = ''; LS.removeItem('tk'); render(); } throw new Error(j.error || 'Помилка'); }
  return j;
}

function toast(msg, type = 'ok') {
  const t = document.createElement('div'); t.className = 'toast ' + (type === 'err' ? 'err' : '');
  t.textContent = msg; $('#toasts').appendChild(t);
  setTimeout(() => { t.style.transition = '.4s'; t.style.opacity = 0; t.style.transform = 'translateX(120%)'; setTimeout(() => t.remove(), 400); }, type === 'err' ? 5500 : 3000);
}

function applyTheme() {
  const c = S.cfg || {}, r = document.documentElement.style;
  if (/^#[0-9a-f]{6}$/i.test(c.accent || '')) r.setProperty('--accent', c.accent);
  if (/^#[0-9a-f]{6}$/i.test(c.accent2 || '')) r.setProperty('--accent2', c.accent2);
  document.body.classList.toggle('nofx', c.fx === 'off');
  document.title = (c.siteName || 'Tobacco Shop') + ' — RP';
}

/* ---------- Модалки та форми ---------- */
function modal(html, onMount) {
  const m = document.createElement('div'); m.className = 'modal';
  m.innerHTML = `<div class="mbox">${html}</div>`; document.body.appendChild(m);
  const close = () => { m.classList.add('out'); setTimeout(() => m.remove(), 200); };
  m.addEventListener('mousedown', e => { if (e.target === m) close(); });
  onMount && onMount(m.querySelector('.mbox'), close);
  return close;
}
function fieldHtml(f) {
  const v = f.value ?? '';
  if (f.type === 'checkbox') return `<label class="chk"><input type="checkbox" name="${f.k}" ${f.value ? 'checked' : ''}> ${esc(f.label)}</label>`;
  let inp;
  if (f.type === 'select') inp = `<select name="${f.k}">${f.options.map(o => `<option value="${esc(o.v)}" ${String(o.v) === String(v) ? 'selected' : ''}>${esc(o.t)}</option>`).join('')}</select>`;
  else if (f.type === 'textarea') inp = `<textarea name="${f.k}" rows="3" placeholder="${esc(f.ph || '')}">${esc(v)}</textarea>`;
  else inp = `<input name="${f.k}" type="${f.type || 'text'}" value="${esc(v)}" placeholder="${esc(f.ph || '')}" ${f.type === 'number' ? 'step="any"' : ''} ${f.req ? 'required' : ''} ${f.type === 'color' ? 'style="height:44px;padding:.2rem"' : ''}>`;
  return `<label>${esc(f.label)}</label>${inp}`;
}
function form({ title, fields, submit = 'Зберегти', note = '', onSubmit }) {
  modal(`<h3>${esc(title)}</h3>${note ? `<p class="muted" style="font-size:.85rem">${esc(note)}</p>` : ''}<form>${fields.map(fieldHtml).join('')}<div class="row end"><button type="button" class="btn ghost" data-x>Скасувати</button><button class="btn">${esc(submit)}</button></div></form>`,
    (box, close) => {
      box.querySelector('[data-x]').onclick = close;
      box.querySelector('form').onsubmit = async e => {
        e.preventDefault(); const v = {};
        fields.forEach(f => { const el = box.querySelector(`[name="${f.k}"]`); v[f.k] = f.type === 'checkbox' ? el.checked : f.type === 'number' ? Number(el.value) : el.value; });
        const b = box.querySelector('form .btn:not(.ghost)'); b.disabled = true;
        try { await onSubmit(v); close(); } catch (err) { toast(err.message, 'err'); b.disabled = false; }
      };
      const first = box.querySelector('input,select,textarea'); first && first.focus();
    });
}
function confirmBox(text, onYes, yes = 'Видалити') {
  modal(`<h3>Підтвердження</h3><p style="margin:.8rem 0 1.2rem">${esc(text)}</p><div class="row end"><button class="btn ghost" data-n>Скасувати</button><button class="btn danger" data-y>${esc(yes)}</button></div>`,
    (box, close) => { box.querySelector('[data-n]').onclick = close; box.querySelector('[data-y]').onclick = async () => { try { await onYes(); close(); } catch (e) { toast(e.message, 'err'); } }; });
}

/* ---------- Дані ---------- */
function applyState(j) {
  if (j.user) S.user = j.user; if (j.settings) S.cfg = j.settings;
  if (j.categories) S.cats = j.categories; if (j.items) S.items = j.items;
  if (j.recipes) S.recipes = j.recipes; if (j.users) S.users = j.users;
  applyTheme();
}
async function load() { applyState(await api('state')); }
const isAdmin = () => S.user && S.user.role === 'admin';
const itemById = id => S.items.find(i => i.id === id);
const catName = id => (S.cats.find(c => c.id === id) || {}).name || '—';
const catIcon = id => (S.cats.find(c => c.id === id) || {}).icon || '';
const catsOf = t => S.cats.filter(c => c.type === t);
const isLow = i => i.minQty > 0 && i.qty <= i.minQty;
const num = n => Number(n).toLocaleString('uk-UA');

/* ---------- Рендер ---------- */
function render() {
  const app = $('#app');
  if (!S.user) return renderLogin(app);
  const nav = [['stock', '📦 Склад'], ['craft', '⚒️ Крафт']]; if (isAdmin()) nav.push(['admin', '⚙️ Адмін-панель']);
  app.innerHTML = `<header class="top"><div class="topIn">
    <div class="brand"><span>🚬</span>${esc(S.cfg.siteName || 'Tobacco Shop')}</div>
    <nav>${nav.map(([k, t]) => `<button data-act="nav" data-v="${k}" class="${S.view === k ? 'on' : ''}">${t}</button>`).join('')}</nav>
    <div class="userChip"><div class="avatar">${esc((S.user.name || '?')[0].toUpperCase())}</div>
      <div style="line-height:1.15"><div style="font-size:.9rem">${esc(S.user.name)}</div><div class="muted" style="font-size:.72rem">${isAdmin() ? 'Адміністратор' : 'Працівник'}</div></div>
      <button class="btn ghost sm" data-act="pass">🔑</button><button class="btn ghost sm" data-act="logout">Вийти</button></div>
  </div></header><main id="main"></main>`;
  renderMain();
}
function renderMain() {
  const m = $('#main'); if (!m) return;
  if (S.view === 'stock') m.innerHTML = viewStock();
  else if (S.view === 'craft') m.innerHTML = viewCraft();
  else if (S.view === 'admin' && isAdmin()) m.innerHTML = viewAdmin();
  if (S.view === 'stock') renderStockList(); if (S.view === 'craft') renderCraftList();
}

/* ---- Вхід ---- */
function renderLogin(app) {
  app.innerHTML = `<div class="loginWrap"><div class="card loginCard fadeUp">
    <div class="logo">🚬</div><h1>${esc(S.cfg.siteName || 'Tobacco Shop')}</h1>
    <p class="muted">${esc(S.cfg.tagline || '')}</p>
    <form id="lf"><label>Логін</label><input name="login" autocomplete="username" required autofocus>
    <label>Пароль</label><input name="password" type="password" autocomplete="current-password" required>

/* ---- Крафт ---- */
function viewCraft() {
  return `<div class="pageTitle fadeUp"><div><h2>Меню крафту</h2><span class="muted">Предмет створюється лише якщо на складі вистачає інгредієнтів</span></div></div>
  <div class="bar"><input id="q" placeholder="🔍 Пошук рецепта…" value="${esc(S.q)}" oninput="S.q=this.value;renderCraftList()"><div class="chips">${chips('recipe')}</div></div><div id="list"></div>`;
}
function maxCraft(r) {
  return Math.min(...r.ingredients.map(g => { const it = itemById(g.itemId); return it ? Math.floor(it.qty / g.qty) : 0; }));
}
function renderCraftList() {
  const el = $('#list'); if (!el) return;
  const q = S.q.toLowerCase();
  const list = S.recipes.filter(r => r.active && (S.cat === 'all' || r.categoryId === S.cat) && (!q || (r.name + r.desc).toLowerCase().includes(q)));
  el.innerHTML = list.length ? `<div class="grid big">${list.map((r, n) => {
    const t = S.times[r.id] || 1, mx = maxCraft(r), can = mx >= t, res = itemById(r.resultItemId);
    return `<div class="card it tilt fadeUp" style="animation-delay:${Math.min(n, 12) * .05}s">
      <div class="row" style="justify-content:space-between"><span class="ic">${esc(r.icon)}</span><span class="badge ${mx > 0 ? 'ok' : 'bad'}">${mx > 0 ? 'Можна створити: ' + mx : 'Немає матеріалів'}</span></div>
      <h3>${esc(r.name)}</h3><div class="muted" style="font-size:.8rem">${esc(catIcon(r.categoryId))} ${esc(catName(r.categoryId))}</div>
      ${r.desc ? `<div class="muted" style="font-size:.82rem;margin-top:.3rem">${esc(r.desc)}</div>` : ''}
      <div class="result">➜ Результат: <b>${esc(res ? res.name : '???')} ×${r.resultQty * t}</b></div>
      <ul class="ingr">${r.ingredients.map(g => { const it = itemById(g.itemId), have = it ? it.qty : 0, need = g.qty * t;
        return `<li class="${have >= need ? 'ok' : 'no'}"><span>${esc(it ? it.icon + ' ' + it.name : '???')}</span><b>${num(have)} / ${num(need)}</b></li>`; }).join('')}</ul>
      <div class="row" style="justify-content:space-between">
        <div class="stepper"><button data-act="tm" data-id="${r.id}" data-d="-1">−</button><span>${t}</span><button data-act="tm" data-id="${r.id}" data-d="1">+</button><button data-act="tm" data-id="${r.id}" data-d="max" title="Максимум">⤒</button></div>
        <button class="btn" data-act="craft" data-id="${r.id}" ${can ? '' : 'disabled'}>${can ? '⚒️ Створити' : 'Не вистачає'}</button></div>
    </div>`; }).join('')}</div>` : `<div class="empty"><span class="big">⚒️</span>Рецептів поки немає</div>`;
}
async function doCraft(id, btn) {
  const r = S.recipes.find(x => x.id === id); btn.disabled = true; btn.textContent = 'Кроблю…';
  try {
    const j = await api('craft', { recipeId: id, times: S.times[id] || 1 });
    S.items = j.items; toast(`✅ Створено: ${j.resultName} ×${j.made}`);
    const b = btn.getBoundingClientRect(); puff(b.left + b.width / 2, b.top);
    S.times[id] = 1;
  } catch (e) { toast(e.message, 'err'); try { await load(); } catch (_) {} }
  renderCraftList();
}

  const rowHtml = (g = {}) => `<div class="ingRow"><select>${iopt.replace(`value="${g.itemId}"`, `value="${g.itemId}" selected`)}</select><input type="number" min="0" step="any" value="${g.qty || 1}"><button type="button" class="btn sm danger" data-rm>✕</button></div>`;

  modal(`<h3>${r ? 'Редагувати рецепт' : 'Новий рецепт'}</h3><form>${f.map(fieldHtml).join('')}
    <label>Інгредієнти (списуються зі складу)</label><div id="ings">${(r?.ingredients?.length ? r.ingredients : [{}]).map(rowHtml).join('')}</div>
    <button type="button" class="btn sm ghost" data-addi style="margin-top:.3rem">＋ Інгредієнт</button>

/* ---------- Обробка кліків ---------- */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); if (!t) return;
  const a = t.dataset.act, id = t.dataset.id;
  switch (a) {
    case 'nav': S.view = t.dataset.v; S.q = ''; S.cat = 'all'; render(); break;
    case 'adm': S.adm = t.dataset.v; renderMain(); break;
    case 'cat': S.cat = id; renderMain(); break;
    case 'tm': { const r = S.recipes.find(x => x.id === id); let c = S.times[id] || 1; const d = t.dataset.d;
      c = d === 'max' ? Math.max(1, maxCraft(r)) : Math.max(1, Math.min(999, c + Number(d))); S.times[id] = c; renderCraftList(); break; }
    case 'craft': doCraft(id, t); break;
    case 'logout': api('logout').catch(() => {}); S.user = null; S.token = ''; LS.removeItem('tk'); render(); break;
    case 'pass': form({ title: 'Зміна пароля', fields: [{ k: 'o', type: 'password', label: 'Старий пароль', req: true }, { k: 'n', type: 'password', label: 'Новий пароль', req: true }],
      onSubmit: async v => { await api('changePassword', { oldPassword: v.o, newPassword: v.n }); toast('Пароль змінено'); } }); break;
    case 'seturl': askUrl(); break;
    case 'itemNew': itemForm(); break;
    case 'itemEdit': itemForm(itemById(id)); break;
    case 'itemDel': confirmBox(`Видалити предмет «${itemById(id).name}»?`, () => mut('deleteItem', { id }, 'Видалено')); break;
    case 'stockAdd': stockForm(itemById(id), 1); break;
    case 'stockSub': stockForm(itemById(id), -1); break;
    case 'catNew': catForm(null, t.dataset.t); break;
    case 'catEdit': catForm(S.cats.find(c => c.id === id)); break;
    case 'catDel': confirmBox('Видалити категорію?', () => mut('deleteCategory', { id }, 'Видалено')); break;
    case 'recNew': recipeForm(); break;
    case 'recEdit': recipeForm(S.recipes.find(r => r.id === id)); break;
    case 'recDel': confirmBox('Видалити рецепт?', () => mut('deleteRecipe', { id }, 'Видалено')); break;
    case 'userNew': userForm(); break;
    case 'userEdit': userForm(S.users.find(u => u.login === id)); break;
    case 'userDel': confirmBox(`Видалити користувача «${id}»?`, () => mut('deleteUser', { login: id }, 'Видалено')); break;
    case 'logReload': S.log = null; renderMain(); break;
  }
});
document.addEventListener('submit', async e => {
  if (e.target.id !== 'sf') return; e.preventDefault();
  const f = e.target, s = { siteName: f.siteName.value, tagline: f.tagline.value, welcome: f.welcome.value, accent: f.accent.value, accent2: f.accent2.value, fx: f.fx.checked ? 'on' : 'off' };
  try { await mut('saveSettings', { settings: s }, 'Налаштування збережено'); } catch (err) { toast(err.message, 'err'); }
});

/* ---------- Ефекти: курсор-підсвітка ---------- */
document.addEventListener('mousemove', e => {
  const c = e.target.closest && e.target.closest('.tilt'); if (!c) return;
  const b = c.getBoundingClientRect(), x = e.clientX - b.left, y = e.clientY - b.top;
  c.style.setProperty('--mx', x + 'px'); c.style.setProperty('--my', y + 'px');
  c.style.transform = `perspective(900px) rotateX(${((y / b.height) - .5) * -5}deg) rotateY(${((x / b.width) - .5) * 5}deg) translateY(-3px)`;
});
document.addEventListener('mouseout', e => { const c = e.target.closest && e.target.closest('.tilt'); if (c && !c.contains(e.relatedTarget)) c.style.transform = ''; });

/* ---------- Ефекти: дим, іскри, декор ---------- */
const cv = $('#fx'), cx = cv.getContext('2d'); let W, H, smoke = [], embers = [], bursts = [];
function resize() { W = cv.width = innerWidth; H = cv.height = innerHeight; }
addEventListener('resize', resize); resize();
const rnd = (a, b) => a + Math.random() * (b - a);
function newSmoke(init) { return { x: rnd(0, W), y: init ? rnd(0, H) : H + 80, r: rnd(60, 150), vy: rnd(.15, .5), ph: rnd(0, 6.28), a: rnd(.025, .07), life: rnd(0, 1) }; }
function newEmber(init) { return { x: rnd(0, W), y: init ? rnd(0, H) : H + 10, r: rnd(.8, 2.4), vy: rnd(.3, 1.1), ph: rnd(0, 6.28), sp: rnd(.005, .02) }; }
for (let i = 0; i < 16; i++) smoke.push(newSmoke(true)); for (let i = 0; i < 34; i++) embers.push(newEmber(true));
function hexRgb(h) { h = (h || '#e8a33d').replace('#', ''); return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)]; }
function puff(x, y) { for (let i = 0; i < 26; i++) bursts.push({ x, y, vx: rnd(-2.2, 2.2), vy: rnd(-3.5, -.6), r: rnd(2, 5), life: 1 }); }
function tick(ts) {
  requestAnimationFrame(tick);
  if (document.body.classList.contains('nofx') && !bursts.length) { cx.clearRect(0, 0, W, H); return; }
  cx.clearRect(0, 0, W, H);
  const [r, g, b] = hexRgb(getComputedStyle(document.documentElement).getPropertyValue('--accent').trim());
  if (!document.body.classList.contains('nofx')) {
    smoke.forEach((s, i) => {
      s.y -= s.vy; s.x += Math.sin(ts / 2400 + s.ph) * .45; s.r += .06; s.life += .0012;
      const al = s.a * Math.sin(Math.min(1, ((H + 80 - s.y) / (H + 160))) * Math.PI);
      if (s.y < -s.r) smoke[i] = newSmoke(false);
      const gr = cx.createRadialGradient(s.x, s.y, 0, s.x, s.y, s.r); gr.addColorStop(0, `rgba(210,200,185,${Math.max(0, al)})`); gr.addColorStop(1, 'rgba(210,200,185,0)');
      cx.fillStyle = gr; cx.beginPath(); cx.arc(s.x, s.y, s.r, 0, 6.28); cx.fill();
    });
    embers.forEach((e, i) => {
      e.y -= e.vy; e.x += Math.sin(ts * e.sp + e.ph) * .7; if (e.y < -10) embers[i] = newEmber(false);
      const fl = .45 + Math.sin(ts / 220 + e.ph) * .35;
      cx.fillStyle = `rgba(${r},${g},${b},${fl})`; cx.shadowColor = `rgb(${r},${g},${b})`; cx.shadowBlur = 10;
      cx.beginPath(); cx.arc(e.x, e.y, e.r, 0, 6.28); cx.fill(); cx.shadowBlur = 0;
    });
  }
  bursts = bursts.filter(p => p.life > 0);
  bursts.forEach(p => { p.x += p.vx; p.y += p.vy; p.vy += .05; p.life -= .02; cx.fillStyle = `rgba(${r},${g},${b},${Math.max(0, p.life)})`; cx.beginPath(); cx.arc(p.x, p.y, p.r * p.life + .5, 0, 6.28); cx.fill(); });
}
requestAnimationFrame(tick);
(function decor() {
  const em = ['🍂', '🌿', '🚬', '🔥', '🍃', '🪔', '🕯️', '🍁']; const d = $('#decor');
  for (let i = 0; i < 15; i++) { const s = document.createElement('span'); s.className = 'fl'; s.textContent = em[i % em.length];
    s.style.cssText = `left:${rnd(2, 96)}%;top:${rnd(5, 92)}%;font-size:${rnd(1.4, 4)}rem;--d:${rnd(14, 28)}s;--dl:${-rnd(0, 20)}s`; d.appendChild(s); }
})();

/* ---------- Запуск ---------- */
async function boot() {
  const app = $('#app'); app.innerHTML = '<div class="loader"></div>';
  if (!API) { S.cfg = {}; render(); askUrl(); return; }
  try { const p = await api('public'); S.cfg = p.settings; applyTheme(); }
  catch (e) { toast(e.message, 'err'); }
  if (S.token) { try { await load(); } catch (e) { S.user = null; } }
  render();
}
boot();
</script>
